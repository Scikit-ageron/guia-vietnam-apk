<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Patinazo</title>
<!--
  «Patinazo» (diseño: src/juego/patinazo/DISENO.md y DISENO-50.md; investigación: INVESTIGACION.md). El hockey de aire de
  Bottleville: en vertical, tu mazo (un tapón de corcho) se mueve con el dedo y juegas 50 niveles en 5 zonas del pueblo,
  cada uno con su rival, su mesa, su disco y lo nuevo de ese nivel (obstáculos, suelos, poderes…). Cada rival tiene un
  TRUCO SECRETO que hay que descubrir. 3 estrellas por nivel (ganar, meter con su truco y un reto); cada estrella NUEVA,
  1 chapa (tope de la app; en la oficial, sin premios). Antes de cada partida, la leyenda de esa mesa.
  Fuente: este fichero + nucleo.js (física, IA y partida) + niveles.js (números, zonas, rivales y niveles); lo de la app
  lo genera `node scripts/juego.mjs patinazo`.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root { --fondo: #14110d; --sup: #231c14; --sup2: #30261b; --borde: #4a3b2a; --texto: #fbf4e8; --apoyo: #cdbb9f;
  --ambar: #f2a33a; --tinta: #2a1d12; --oro: #f5c542; --vacia: #8a7458; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
body { overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
svg.ic { width: 1.1em; height: 1.1em; vertical-align: -0.18em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#lienzo { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.mini { background: rgba(20,17,13,.78); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 99px; padding: 0 14px;
  font-size: 14px; font-weight: 800; min-height: 40px; min-width: 44px; }
.arriba { position: fixed; top: calc(env(safe-area-inset-top) + 8px); z-index: 3; }
#salir { left: calc(env(safe-area-inset-left) + 10px); }
#b-sonido { right: calc(env(safe-area-inset-right) + 10px); padding: 0; width: 44px; }
.oculto { display: none !important; }
#aviso { position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; text-align: center;
  background: rgba(20,17,13,.9); border: 2px solid var(--oro); border-radius: 18px; padding: 10px 18px; max-width: 86vw; display: none; }
#aviso.ver { display: block; animation: sube .35s both; }
#aviso b { display: block; font-family: 'Gochi Hand', cursive; font-weight: 400; color: var(--oro); font-size: 30px; line-height: 1.05; }
#aviso span { font-size: 15px; line-height: 1.35; }
.capa #aviso, .capa.ver ~ #aviso { z-index: 30; }
@keyframes sube { from { transform: translate(-50%, -30%) scale(.7); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
#hud { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 6px); z-index: 3; display: flex; gap: 6px; pointer-events: none; }
#hud .pild { display: flex; align-items: center; gap: 5px; background: rgba(20,17,13,.82); border: 1px solid var(--oro); border-radius: 99px;
  padding: 3px 10px 3px 4px; font-size: 13px; font-weight: 800; color: #fff; }
#hud .pild.suyo { border-color: #ff8a80; }
#hud img { width: 26px; height: 26px; }
/* Capas */
.capa { position: fixed; inset: 0; background: #17120c; display: none; z-index: 10; overflow-y: auto; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px); }
.capa.ver { display: flex; }
.capa.velo { background: rgba(14,10,6,.82); align-items: center; justify-content: center; }
.cab { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.total { color: var(--oro); font-weight: 900; font-size: 16px; }
h1 { font-family: 'Gochi Hand', cursive; color: var(--ambar); font-size: 40px; margin: 2px 0 0; line-height: 1; font-weight: 400; }
h2 { font-family: 'Gochi Hand', cursive; color: #fff; font-size: 30px; margin: 0; line-height: 1.05; font-weight: 400; }
.sub { color: var(--apoyo); font-size: 15px; margin-top: 2px; line-height: 1.35; }
.btn { background: var(--ambar); color: var(--tinta); border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 900;
  font-size: 16px; box-shadow: 0 3px 0 #a86814; min-height: 48px; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a86814; }
.btn.sec { background: var(--sup2); color: var(--texto); box-shadow: 0 3px 0 #0008; border: 1px solid var(--borde); }
.btn.grande { width: 100%; min-height: 52px; font-size: 18px; }
.aviso18 { text-align: center; color: var(--apoyo); font-size: 12.5px; margin: 10px 0 0; line-height: 1.4; }
/* Portada */
.seguir { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; margin: 12px 0 10px; background: var(--sup2);
  border: 2px solid var(--ambar); border-radius: 18px; padding: 10px 12px; color: var(--texto); }
.seguir img { width: 56px; height: 56px; flex: none; }
.seguir .t { flex: 1; min-width: 0; }
.seguir .t small { display: block; color: var(--apoyo); font-size: 13px; font-weight: 700; }
.seguir .t b { display: block; font-size: 17px; color: #fff; }
.seguir .ir { background: var(--ambar); color: var(--tinta); border-radius: 12px; padding: 9px 12px; font-weight: 900; font-size: 15px; flex: none; }
.zonas { display: flex; flex-direction: column; gap: 8px; }
.zona { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--sup); border: 1px solid var(--borde);
  border-radius: 16px; padding: 6px 10px 6px 6px; color: var(--texto); min-height: 68px; }
.zona .dib { width: 56px; height: 56px; flex: none; border-radius: 12px; }
.zona .t { flex: 1; min-width: 0; }
.zona .t b { display: block; font-size: 16px; color: #fff; }
.zona .t small { display: block; font-size: 13px; color: var(--apoyo); }
.zona .barra { height: 4px; background: #0006; border-radius: 4px; margin-top: 4px; overflow: hidden; }
.zona .barra i { display: block; height: 100%; background: var(--oro); }
.zona .jefe { width: 40px; height: 40px; flex: none; }
.zona.media { border: 2px solid var(--ambar); }
.zona.cerrada { opacity: .55; }
.zona.cerrada .jefe, .nodo.cerrado img, .jefe-nodo.cerrado img { filter: brightness(0) opacity(.55); }
.ancho { width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
/* Mapa de una zona */
.rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; position: relative; }
.nodo { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--sup);
  border: 1px solid var(--borde); border-radius: 16px; padding: 6px 2px 5px; min-height: 96px; color: var(--texto); }
.nodo img { width: 52px; height: 52px; }
.nodo .n { position: absolute; top: 4px; left: 6px; background: var(--sup2); border: 1px solid var(--borde); border-radius: 99px; font-weight: 900;
  font-size: 13px; min-width: 24px; height: 24px; line-height: 22px; text-align: center; color: #fff; }
.nodo .est, .jefe-nodo .est { font-size: 15px; letter-spacing: 1px; color: var(--vacia); line-height: 1; }
.nodo .est b, .jefe-nodo .est b { color: var(--oro); font-weight: 400; }
.nodo.sig, .jefe-nodo.sig { border: 3px solid var(--ambar); background: var(--sup2); }
.nodo .toca { position: absolute; top: -9px; right: 4px; background: var(--ambar); color: var(--tinta); font-size: 11.5px; font-weight: 900; border-radius: 99px; padding: 1px 7px; }
.nodo .candado, .jefe-nodo .candado { position: absolute; bottom: 30px; right: 10px; color: var(--apoyo); font-size: 18px; }
.camino { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.nodo, .jefe-nodo { z-index: 1; }
.jefe-nodo { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; background: var(--sup); border: 2px solid var(--oro);
  border-radius: 18px; padding: 8px 14px; min-height: 84px; color: var(--texto); text-align: left; position: relative; }
.jefe-nodo img { width: 64px; height: 64px; flex: none; }
.jefe-nodo .t { flex: 1; }
.jefe-nodo .t small { display: inline-block; background: var(--oro); color: var(--tinta); font-weight: 900; font-size: 13px; border-radius: 6px; padding: 0 6px; }
.jefe-nodo .t b { display: block; font-size: 18px; color: #fff; margin-top: 2px; }
.pie-zonas { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
.pie-zonas button { flex: 1; min-height: 48px; font-size: 14px; padding: 6px 8px; }
/* Leyenda antes de jugar */
.ley { display: flex; flex-direction: column; gap: 9px; flex: 1; }
.zona-n { color: var(--apoyo); font-size: 13px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
.quien { display: flex; gap: 12px; align-items: center; }
.quien img { width: 72px; height: 72px; flex: none; }
.quien .frase { font-size: 15px; line-height: 1.3; font-style: italic; color: var(--texto); margin-top: 2px; }
.jefe-tag { display: inline-block; background: var(--oro); color: var(--tinta); font-size: 12px; font-weight: 900; border-radius: 6px; padding: 0 6px; vertical-align: 4px; margin-left: 6px; font-family: system-ui, sans-serif; }
.seccion { color: var(--apoyo); font-size: 13px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; margin-bottom: -3px; }
.cosas { display: flex; flex-direction: column; gap: 6px; }
.cosa { display: flex; gap: 10px; align-items: center; background: var(--sup); border: 1px solid var(--borde); border-radius: 12px; padding: 5px 10px 5px 6px; min-height: 44px; }
.cosa img { width: 34px; height: 34px; flex: none; }
.cosa .t { font-size: 14.5px; line-height: 1.25; }
.cosa .t b { color: #fff; }
.cosa.nuevo { border: 2px solid var(--oro); }
.chapita { display: inline-block; background: var(--oro); color: var(--tinta); font-size: 12px; font-weight: 900; border-radius: 6px; padding: 0 5px; margin-right: 5px; vertical-align: 1px; }
.mas { font-size: 13px; color: var(--apoyo); padding-left: 4px; }
.dato { background: var(--sup2); border-radius: 12px; padding: 8px 11px; font-size: 14.5px; line-height: 1.35; display: flex; gap: 9px; align-items: flex-start; }
.dato b { color: #fff; }
.dato .lupa { color: var(--oro); font-size: 20px; flex: none; margin-top: 1px; }
.dato.truco { border: 1.5px dashed var(--oro); }
.dato.truco.si { border-style: solid; }
.dato.truco b { color: var(--oro); }
.retos { display: flex; flex-direction: column; gap: 3px; }
.reto { display: flex; gap: 8px; align-items: center; font-size: 15px; line-height: 1.25; }
.reto .e { font-size: 21px; color: var(--vacia); width: 22px; text-align: center; flex: none; }
.reto .e.si { color: var(--oro); }
.reto small { color: var(--apoyo); font-size: 13px; margin-left: 4px; }
.reto.nueva .e { animation: sale .45s both; }
#intro .btn.grande { margin-top: 10px; flex: none; }
@keyframes sale { from { transform: scale(.2) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
/* Leyenda general */
.pestanas { display: flex; gap: 4px; background: var(--sup); border-radius: 12px; padding: 3px; margin: 8px 0 10px; }
.pestanas button { flex: 1; min-height: 40px; border: 0; background: none; border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--apoyo); padding: 0 2px; }
.pestanas button[aria-selected="true"] { background: var(--sup2); color: #fff; box-shadow: inset 0 -2px 0 var(--ambar); }
.fichas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fichas.una { grid-template-columns: 1fr; }
.ficha.ancha { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 12px; min-height: 76px; text-align: left; }
.ficha.ancha img, .ficha.ancha .q { width: 56px; height: 56px; flex: none; }
.ficha.ancha b { display: block; font-size: 16px; color: #fff; }
.ficha.ancha small { display: block; font-size: 14px; font-weight: 600; color: var(--apoyo); margin-top: 2px; line-height: 1.3; }
.nota-pest { grid-column: 1 / -1; color: var(--apoyo); font-size: 14.5px; line-height: 1.35; }
.nota-pest:empty { display: none; }
.ficha { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--sup); border: 1px solid var(--borde); border-radius: 14px;
  padding: 8px 4px; min-height: 92px; color: var(--texto); font-size: 13px; font-weight: 700; text-align: center; line-height: 1.15; }
.ficha img { width: 48px; height: 48px; }
.ficha.no { color: var(--vacia); }
.ficha .q { width: 48px; height: 48px; border-radius: 12px; background: #0006; border: 1.5px dashed var(--vacia); display: flex; align-items: center; justify-content: center; font-family: 'Gochi Hand', cursive; font-size: 30px; color: var(--vacia); }
.vacio { color: var(--apoyo); font-size: 15px; text-align: center; padding: 20px 10px; }
.hoja { position: fixed; inset: 0; background: rgba(14,10,6,.75); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.hoja .caja { background: var(--sup); border: 1px solid var(--borde); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 16px 18px calc(env(safe-area-inset-bottom) + 16px);
  display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.hoja img { width: 84px; height: 84px; }
.hoja b { font-size: 18px; color: #fff; }
.hoja p { margin: 0; font-size: 15px; line-height: 1.35; }
.hoja small { color: var(--apoyo); font-size: 13.5px; }
/* Final */
.tarjeta { background: var(--sup); border: 1px solid var(--borde); border-radius: 20px; padding: 16px 18px; max-width: 440px; width: 100%;
  display: flex; flex-direction: column; gap: 10px; }
.tarjeta h1 { font-size: 36px; text-align: center; }
.marcador { text-align: center; font-family: 'Gochi Hand', cursive; font-size: 40px; color: #fff; line-height: 1; }
.marcador small { display: block; font-family: system-ui, sans-serif; font-size: 13.5px; color: var(--apoyo); margin-top: 4px; }
.fila { display: flex; gap: 8px; } .fila .btn { flex: 1; padding: 11px 4px; font-size: 15px; white-space: nowrap; }
.nota { text-align: center; font-size: 13.5px; color: var(--apoyo); margin-top: -4px; }
.quien.chica img { width: 48px; height: 48px; }
.quien.chica div { font-size: 14.5px; line-height: 1.35; font-style: italic; }
@media (max-height: 660px) {
  .quien img { width: 58px; height: 58px; } .cosa img { width: 28px; height: 28px; } .cosas { gap: 5px; } .ley { gap: 7px; }
  .cosa { min-height: 40px; } h2 { font-size: 27px; } .zona { min-height: 62px; } .zona .dib { width: 50px; height: 50px; }
  .nodo { min-height: 88px; } .nodo img { width: 46px; height: 46px; } .jefe-nodo { min-height: 74px; } .jefe-nodo img { width: 56px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<canvas id="lienzo" aria-label="Mesa de Patinazo"></canvas>
<button class="mini arriba oculto" id="salir">‹ Mapa</button>
<button class="mini arriba oculto" id="b-sonido" aria-label="Sonido"></button>
<div id="hud" aria-live="polite"></div>
<div id="aviso" role="status"><b id="aviso-t"></b><span id="aviso-s"></span></div>

<div class="capa ver" id="portada">
  <div class="cab"><button class="mini salir-capa">‹ Salir</button><span class="total" id="total"></span></div>
  <h1>Patinazo</h1>
  <div class="sub">Hockey de aire con los vecinos. Cada mesa, su truco.</div>
  <button class="seguir" id="seguir"></button>
  <div class="zonas" id="zonas"></div>
  <button class="btn sec ancho" id="b-leyenda"></button>
  <p class="aviso18">Pon el dedo donde quieras y arrastra: el mazo se mueve contigo.<span id="premio-portada"> Cada estrella nueva, 1 chapa.</span><br>
    +18 · Bebe con cabeza. Aquí nadie bebe: se juega con chapas, posavasos y cubitos.</p>
</div>

<div class="capa" id="mapa">
  <div class="cab"><button class="mini" id="mapa-volver">‹ Zonas</button><span class="total" id="mapa-total"></span></div>
  <h2 id="mapa-nombre"></h2>
  <div class="sub" id="mapa-lema"></div>
  <div class="rejilla" id="rejilla"></div>
  <div class="pie-zonas"><button class="btn sec" id="zona-ant"></button><button class="btn sec" id="zona-sig"></button></div>
</div>

<div class="capa" id="intro">
  <div class="cab"><button class="mini" id="intro-mapa">‹ Mapa</button><span class="total" id="in-total"></span></div>
  <div class="ley">
    <div class="zona-n" id="in-zona"></div>
    <div class="quien"><img id="in-img" alt=""><div><h2 id="in-nombre"></h2><div class="frase" id="in-frase"></div></div></div>
    <div class="seccion">En esta mesa</div>
    <div class="cosas" id="in-cosas"></div>
    <div class="dato truco" id="in-truco"></div>
    <div class="seccion">Estrellas de este nivel</div>
    <div class="retos" id="in-retos"></div>
  </div>
  <button class="btn grande" id="b-empezar">¡A jugar!</button>
</div>

<div class="capa" id="leyenda">
  <div class="cab"><button class="mini" id="ley-volver">‹ Volver</button><span class="total" id="ley-vistos"></span></div>
  <h2>Leyenda</h2>
  <div class="pestanas" role="tablist" id="pestanas"></div>
  <div id="fichas"></div>
</div>

<div class="capa velo" id="final">
  <div class="tarjeta" aria-live="polite">
    <h1 id="f-titulo"></h1>
    <div class="marcador" id="f-marcador"></div>
    <div class="retos" id="f-retos"></div>
    <div class="dato truco oculto" id="f-truco"></div>
    <div class="quien chica"><img id="f-img" alt=""><div id="f-texto"></div></div>
    <div class="fila"><button class="btn sec" id="b-mapa">Mapa</button><button class="btn sec" id="b-otra">Otra</button><button class="btn" id="b-siguiente">Siguiente</button></div>
    <div class="nota oculto" id="f-nota"></div>
  </div>
</div>

<script>

// La física y la IA, en nucleo.js. Medidas en «u» (unidades de mesa): la mesa mide 9 × 16; y = 0 es tu portería
// (abajo) e y = 16 la del rival (arriba).

const PATINAZO_CFG = {
  mesa: { ancho: 9, largo: 16 },
  paso: 1 / 60,           // un fotograma
  subpasos: 4,            // la física va a 1/240 s para que nada atraviese nada
  mazo: { r: 0.62, vmax: 34, dedoArriba: 0.55 }, // tu mazo (el tapón de corcho): radio, velocidad máxima, cuánto va por encima del dedo
  // Cómo se mueve (dueño, 18/10/2026: «donde pongamos el dedo empezamos a moverlo», sin que el mazo salte bajo el dedo):
  // 'relativo' = el mazo se mueve lo mismo que el dedo desde donde lo pones (×sensibilidad); 'absoluto' = va al dedo.
  control: { modo: 'relativo', sensibilidad: 1.15 },
  vmaxDisco: 26,          // ningún disco va más rápido (u/s)
  pausaGol: 1.0,          // segundos de celebración antes del saque
  tiempo: 180,            // cada partido dura como mucho esto (s); al acabar gana el que va por delante, y si hay empate, gol de oro
  atasco: { seg: 5, empuje: 2.5 }, // un disco casi quieto tanto tiempo recibe un empujoncito hacia el centro
  vQuieto: 0.35,
  esquina: 1.0,           // radio de las esquinas redondas de la mesa
  paliza: 3,              // la estrella de «ganar de paliza»: ganar por esta diferencia o más
  chapasPorEstrella: 1,   // cada estrella NUEVA, 1 chapa (tope de la app: 30 por partida, JUEGOS_DE_MESA y dev.topes_chapas)
  golpeFuerte: 9,         // a partir de esta velocidad relativa, chispas grandes y vibración
  seta: { impulso: 3 },   // la chapa-muelle: lo que añade al rebotar (u/s), con el tope de vmaxDisco
  item: { r: 0.5 },       // radio de un poder en la mesa (el disco lo coge si pasa por encima)
  guardado: { clave: 'patinazo:v2', antigua: 'patinazo:v1' }, // el progreso de los 8 de antes se pasa al nuevo
};

// k: la dificultad que ha dejado el simulador (scripts/patinazo-bot.mjs --ajustar) para que la curva salga suave: más
// de 1, el rival va más rápido, piensa antes y falla menos; menos de 1, al revés. Sin k, la IA tal cual.
function escalarIa(ia, k) {
  if (!k || k === 1) return ia;
  return { ...ia, vmax: +(ia.vmax * k).toFixed(2), error: +(ia.error / k).toFixed(3), reaccion: +(ia.reaccion / Math.sqrt(k)).toFixed(3) };
}
// Monta cada nivel: lo del rival + lo de la fila (la IA, mezclada). Los 8 de antes conservan su id (y su guardado).
function montarNivel(f, i) {
  const zona = ZONAS[Math.floor(i / 10)];
  if (f.o) { const o = ORIGINALES.find((x) => x.id === f.o); return { ...o, rival: o.id, lugar: LUGARES[o.mesa] || o.lugar, num: i + 1, zona: zona.id, retos: f.retos, jefe: !!f.jefe, fases: f.fases, ia: escalarIa(o.ia, f.k) }; }
  const R = RIVALES[f.rival], [vmax, reaccion, rebotes, error, devuelve, ataque] = f.ia;
  const n = { ...f, id: 'n' + String(i + 1).padStart(2, '0'), num: i + 1, zona: zona.id, figura: R.figura, alter: R.alter, nombre: R.nombre,
    color: R.color, lugar: LUGARES[f.mesa], truco: R.truco, frases: f.frases || R.frases, discos: f.discos || 1, jefe: !!f.jefe,
    ia: escalarIa({ ...R.ia, vmax, reaccion, rebotes, error, devuelve, ataque, ...(f.iaMas || {}) }, f.k) };
  if (!('poder' in f)) n.poder = R.poder || null;
  if (R.obstaculos && !f.obstaculos) n.obstaculos = R.obstaculos;
  delete n.o;
  return n;
}
const NIVELES = TABLA.map(montarNivel);

// Lo que hay en la mesa de un nivel (claves de ELEMENTOS), en orden: disco, obstáculos, suelos, poderes, lo demás.
function elementosDe(n) {
  const k = new Set();
  k.add('disco:' + n.disco);
  if (n.discos > 1) k.add('dosDiscos');
  const todas = [n, ...(n.fases || [])];
  for (const f of todas) {
    for (const o of f.obstaculos || []) k.add('obs:' + (o.tipo === 'seta' ? 'seta' : o.tipo === 'movil' ? 'movil' : o.id));
    for (const z of f.zonas || []) k.add('zona:' + z.tipo);
    if (f.inclina) k.add('inclina:' + (f.inclina.eje || 'x'));
    if (f.poderes) for (const p of f.poderes.tipos) k.add('poder:' + p);
    if (f.poder) k.add(f.poder.tipo);
    if (f.discos > 1) k.add('dosDiscos');
    if (f.porterias && [...f.porterias.jugador, ...f.porterias.rival].some((g) => g.baila)) k.add('baila');
  }
  if (n.penumbra) k.add('penumbra');
  if (n.encoge) k.add('encoge');
  if (n.ia && n.ia.estilo === 'medio') k.add('medio');
  if (n.truco && n.truco.tipo === 'cumbre') k.add('obs:bandera');
  return [...k].filter((x) => ELEMENTOS[x]);
}

// ==FISICA==
// «Patinazo» (src/juego/patinazo/DISENO.md): la física de la mesa, la IA de los rivales, sus trucos y la partida. Puro:
// sin pantalla ni DOM, para que las pruebas (pruebas/patinazo.test.js) y el bot lo carguen igual que el móvil. Usa
// PATINAZO_CFG, DISCOS y NIVELES (niveles.js). Paso fijo y azar con semilla: todo es determinista.

function azarSemilla(s) { // mulberry32
  let a = (s >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const limitar = (v, a, b) => (v < a ? a : v > b ? b : v);

function nivelPorId(id) { return NIVELES.find((n) => n.id === id) || null; }

// Las porterías de un lado en el instante t: [{ a, b, x }] (bordes en x). La de La Chunda baila con el bombo; las que
// tienen «baila» sin bombo, con su «periodo»; con «encoge», cada gol que recibe la estrecha; la escoba la medio cierra.
function porteriasDe(P, lado, t) {
  let lista = P.nivel.porterias[lado];
  const quien = lado === 'jugador' ? 'j' : 'r', tp = P.nivel.tapa;
  // El periódico de El Coloso (fase 2): tapa una de las porterías de ese lado y cambia cada «cada» s
  if (tp && tp.lado === lado && lista.length > 1) { const k = Math.floor(t / tp.cada) % lista.length; lista = lista.filter((g, i) => i !== k); }
  const ef = P.efectos ? P.efectos[quien] : null, menos = P.encoge ? P.encoge[lado] : 0;
  return lista.map((g) => {
    let x = g.x, w = g.w;
    if (g.baila) {
      if (P.nivel.poder && P.nivel.poder.tipo === 'temazo') {
        const golpe = 60 / P.nivel.poder.bpm;
        x = g.x + g.baila * Math.sin((2 * Math.PI * t) / (golpe * 8));
      } else x = g.x + g.baila * Math.sin((2 * Math.PI * t) / (g.periodo || 5));
    }
    if (menos) w = Math.max((P.nivel.encoge && P.nivel.encoge.min) || 2, w - menos);
    if (ef && ef.escoba > 0) w *= PODERES.escoba.factor;
    if (w !== g.w || g.baila) x = limitar(x, w / 2, P.A - w / 2);
    return { x, a: x - w / 2, b: x + w / 2 };
  });
}

// Los obstáculos en el instante t (los «movil» van y vienen): se guardan en P.obs con su velocidad.
function moverObstaculos(P, t) {
  for (const o of P.obs) {
    if (o.tipo !== 'movil') continue;
    const w = (2 * Math.PI) / (o.periodo || 4), s = Math.sin(w * t + (o.fase || 0)), c = Math.cos(w * t + (o.fase || 0));
    if (o.eje === 'y') { o.y = o.y0 + o.amp * s; o.vy = o.amp * w * c; } else { o.x = o.x0 + o.amp * s; o.vx = o.amp * w * c; }
  }
}
const dentroZona = (z, d) => Math.abs(d.x - z.x) < z.w / 2 && Math.abs(d.y - z.y) < z.h / 2;
function efectosVacios() { return { grande: 0, escoba: 0, pegamento: 0, doble: 0 }; }
const esTrucoItem = (t) => t === 'ofrenda' || t === 'pizza'; // lo que sale en la mesa por el truco del rival (no es un poder)

function nuevoDisco(P, i, enJugador) {
  const D = DISCOS[P.nivel.disco], A = P.A, L = P.L;
  const nd = P.nivel.discos;
  const x = nd > 1 ? (i === 0 ? A * 0.3 : A * 0.7) : A / 2;
  return { i, x, y: enJugador ? L * 0.27 : L * 0.73, vx: 0, vy: 0, r: D.r, rebotes: 0, ultimo: null, w: 0, quieto: 0,
    contra: false, fuera: false };
}

function crearPartida(nivel, semilla = 1, opciones = {}) {
  const C = PATINAZO_CFG, A = C.mesa.ancho, L = C.mesa.largo;
  const P = {
    nivel, D: DISCOS[nivel.disco], A, L, t: 0, rng: azarSemilla(semilla),
    marcador: { j: 0, r: 0 }, fase: 'jugando', faseT: 0, ui: [], resultado: null,
    jug: { x: A / 2, y: 1.6, vx: 0, vy: 0, r: C.mazo.r, ox: A / 2, oy: 1.6 },
    riv: { x: A / 2, y: nivel.ia.defY, vx: 0, vy: 0, r: nivel.ia.rMazo, ox: A / 2, oy: nivel.ia.defY, piensa: 0, estado: 'normal', hasta: 0,
      lado: 1, cambio: nivel.ia.cambioCada || 0 },
    truco: { descubierto: false, hasta: -1, veces: 0, trucoAntes: !!opciones.trucoAntes },
    poder: { helada: 0, proxima: nivel.poder && nivel.poder.cada ? nivel.poder.cada : 0, seguro: nivel.poder && nivel.poder.tipo === 'seguro' ? nivel.poder.veces : 0, golpes: -1 },
    discos: [], pendientes: [], ventas: 0,
    golpesJugador: 0, tiempo: nivel.tiempo || PATINAZO_CFG.tiempo, oro: false,
    // Lo de las mesas nuevas (DISENO-50.md): obstáculos (copiados: los móviles se mueven), mesa coja, poderes, ofrendas
    obs: (nivel.obstaculos || []).map((o) => ({ tipo: 'fijo', ...o, x0: o.x, y0: o.y, vx: 0, vy: 0 })),
    inclina: nivel.inclina ? { dir: 1, prox: nivel.inclina.cada, avisada: false } : null,
    efectos: { j: efectosVacios(), r: efectosVacios() },
    items: [], itemProx: nivel.poderes ? (nivel.poderes.primero || nivel.poderes.cada) : 0,
    ofrendaProx: nivel.truco && esTrucoItem(nivel.truco.tipo) ? nivel.truco.primero || nivel.truco.cada : 0,
    llamada: nivel.truco && nivel.truco.tipo === 'llamada' ? { prox: nivel.truco.primero || nivel.truco.cada, avisada: false } : null,
    encoge: { jugador: 0, rival: 0 }, enFase2: false,
    stats: { poder: 0, bandas: 0, poderes: 0 },
  };
  if (opciones.vmaxJug) P.vmaxJug = opciones.vmaxJug;
  moverObstaculos(P, 0);
  for (let i = 0; i < nivel.discos; i++) P.discos.push(nuevoDisco(P, i, true));
  if (nivel.discos > 1) P.discos[1].y = L * 0.73; // con dos chapas, una en cada campo
  return P;
}

// ── El mazo de cada uno ─────────────────────────────────────────────────────
function moverMazo(P, m, ox, oy, vmax, h, esRival) {
  const L = P.L, A = P.A;
  const yMin = esRival ? L / 2 + m.r : m.r, yMax = esRival ? L - m.r : L / 2 - m.r;
  const tx = limitar(ox, m.r, A - m.r), ty = limitar(oy, yMin, yMax);
  let dx = tx - m.x, dy = ty - m.y; const d = Math.hypot(dx, dy), max = vmax * h;
  if (d > max) { dx *= max / d; dy *= max / d; }
  m.vx = dx / h; m.vy = dy / h; m.x += dx; m.y += dy;
  // Los mazos no atraviesan los obstáculos (si no, el disco se colaría entre los dos)
  for (const o of P.obs) {
    const ex = m.x - o.x, ey = m.y - o.y, dd = Math.hypot(ex, ey), min = m.r + o.r;
    if (dd < min && dd > 0) { m.x = o.x + (ex / dd) * min; m.y = o.y + (ey / dd) * min; m.y = limitar(m.y, yMin, yMax); m.x = limitar(m.x, m.r, A - m.r); }
  }
}

// Choque de un disco con un círculo que no se mueve por el choque (mazo u obstáculo): devuelve la velocidad del choque.
function chocarCirculo(d, cx, cy, cr, cvx, cvy, reb) {
  const dx = d.x - cx, dy = d.y - cy, dist = Math.hypot(dx, dy), min = d.r + cr;
  if (dist >= min || dist === 0) return 0;
  const nx = dx / dist, ny = dy / dist;
  d.x = cx + nx * min; d.y = cy + ny * min;
  const rvx = d.vx - cvx, rvy = d.vy - cvy, vn = rvx * nx + rvy * ny;
  if (vn >= 0) return 0;
  d.vx -= (1 + reb) * vn * nx; d.vy -= (1 + reb) * vn * ny;
  return -vn;
}

function velocidad(d) { return Math.hypot(d.vx, d.vy); }
function topeVel(P, d) {
  const max = Math.min(PATINAZO_CFG.vmaxDisco, P.D.vmax || 99), v = velocidad(d);
  if (v > max) { d.vx *= max / v; d.vy *= max / v; }
}

// Fase del bombo de La Chunda (0-1 dentro de cada golpe) o -1 si no hay bombo.
function faseBombo(P) {
  const pd = P.nivel.poder; if (!pd || pd.tipo !== 'temazo') return -1;
  const g = 60 / pd.bpm; return (P.t % g) / g;
}

// Las esquinas de la mesa son redondas (radio PATINAZO_CFG.esquina): el disco no se queda encajado en un rincón.
function esquinas(P, d) {
  const Rc = PATINAZO_CFG.esquina, A = P.A, L = P.L;
  for (const [cx, cy, sx, sy] of [[Rc, Rc, -1, -1], [A - Rc, Rc, 1, -1], [Rc, L - Rc, -1, 1], [A - Rc, L - Rc, 1, 1]]) {
    if ((d.x - cx) * sx <= 0 || (d.y - cy) * sy <= 0) continue;
    const dx = d.x - cx, dy = d.y - cy, dist = Math.hypot(dx, dy), max = Rc - d.r;
    if (dist <= max) continue;
    const nx = dx / dist, ny = dy / dist;
    d.x = cx + nx * max; d.y = cy + ny * max;
    const vn = d.vx * nx + d.vy * ny;
    if (vn > 0) { d.vx -= (1 + P.D.rebBanda) * vn * nx; d.vy -= (1 + P.D.rebBanda) * vn * ny; d.rebotes++; }
  }
}

// ── Un subpaso de física ────────────────────────────────────────────────────
function fisica(P, h) {
  const D = P.D, A = P.A, L = P.L;
  for (const d of P.discos) {
    if (d.fuera) continue;
    if (D.curva && d.w) {
      const c = Math.cos(d.w * h), s = Math.sin(d.w * h), vx = d.vx * c - d.vy * s, vy = d.vx * s + d.vy * c;
      d.vx = vx; d.vy = vy; d.w *= Math.exp(-D.curvaApaga * h);
    }
    // Suelos (charco que frena, hielo sin rozamiento, ventilador que empuja) y la mesa coja
    let roz = D.roz;
    if (P.nivel.zonas) for (const z of P.nivel.zonas) {
      if (!dentroZona(z, d)) continue;
      if (z.tipo === 'charco') roz += z.roz || 2.2;
      else if (z.tipo === 'hielo') roz = 0;
      else if (z.tipo === 'viento') { d.vx += (z.fx || 0) * h; d.vy += (z.fy || 0) * h; }
    }
    if (P.inclina) { const gi = P.nivel.inclina.g * P.inclina.dir * h; if (P.nivel.inclina.eje === 'y') d.vy += gi; else d.vx += gi; }
    const f = Math.exp(-roz * h); d.vx *= f; d.vy *= f;
    if (D.derrite) d.r = Math.max(D.rMin, d.r - D.derrite * h);
    d.x += d.vx * h; d.y += d.vy * h;
    // Bandas
    if (d.x < d.r) { d.x = d.r; if (d.vx < 0) { d.vx = -d.vx * D.rebBanda; d.rebotes++; P.ui.push({ tipo: 'banda', x: 0, y: d.y, v: Math.abs(d.vx) }); } }
    if (d.x > A - d.r) { d.x = A - d.r; if (d.vx > 0) { d.vx = -d.vx * D.rebBanda; d.rebotes++; P.ui.push({ tipo: 'banda', x: A, y: d.y, v: Math.abs(d.vx) }); } }
    esquinas(P, d);
    // Fondos con sus porterías
    for (const lado of ['jugador', 'rival']) {
      const abajo = lado === 'jugador';
      const cerca = abajo ? d.y < d.r : d.y > L - d.r;
      if (!cerca) continue;
      const gs = porteriasDe(P, lado, P.t), yl = abajo ? 0 : L;
      const dentro = gs.find((g) => d.x > g.a && d.x < g.b);
      if (dentro) {
        for (const px of [dentro.a, dentro.b]) chocarCirculo(d, px, yl, 0.001, 0, 0, D.rebBanda);
        if (abajo ? d.y < -d.r * 0.2 : d.y > L + d.r * 0.2) { gol(P, d, abajo ? 'r' : 'j'); break; }
      } else {
        if (abajo) { d.y = d.r; if (d.vy < 0) { d.vy = -d.vy * D.rebBanda; d.rebotes++; } }
        else { d.y = L - d.r; if (d.vy > 0) { d.vy = -d.vy * D.rebBanda; d.rebotes++; } }
      }
    }
    if (d.fuera) continue;
    // Obstáculos (la hucha de Sor Abadía, la regadera de Don Filtrado, setas que rebotan, posavasos que van y vienen)
    for (const o of P.obs) {
      const v = chocarCirculo(d, o.x, o.y, o.r, o.vx, o.vy, D.rebBanda);
      if (v > 0) {
        d.rebotes++;
        if (o.tipo === 'seta') { // rebota con impulso, como un champiñón de pinball
          const ex = d.x - o.x, ey = d.y - o.y, l = Math.hypot(ex, ey) || 1, k = o.impulso || PATINAZO_CFG.seta.impulso;
          d.vx += (ex / l) * k; d.vy += (ey / l) * k; topeVel(P, d);
        }
        P.ui.push({ tipo: 'obstaculo', id: o.id, x: o.x, y: o.y, v, seta: o.tipo === 'seta' });
        const tr = P.nivel.truco;
        if (tr.tipo === 'hucha' && o.id === 'hucha' && v >= tr.vMin) { P.riv.estado = 'contando'; P.riv.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen; P.ui.push({ tipo: 'contando' }); }
        if (tr.tipo === 'riego' && o.id === 'regadera' && v >= tr.vMin && P.riv.estado === 'normal' && P.t >= (P.truco.recarga || 0)) { P.truco.recarga = P.t + (tr.recarga || 0); P.riv.estado = 'brother'; P.riv.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen; P.ui.push({ tipo: 'brother' }); }
      }
    }
    // Los poderes y las ofrendas: se cogen si el disco pasa por encima después de TU golpe (o del suyo, si «rivalCoge»)
    for (const it of P.items.slice()) {
      if (Math.hypot(d.x - it.x, d.y - it.y) > d.r + (it.r || PATINAZO_CFG.item.r)) continue;
      const quien = d.ultimo;
      if (esTrucoItem(it.tipo)) { if (quien === 'j' && velocidad(d) >= (P.nivel.truco.vMin || 0)) cogerTrucoItem(P, it); continue; }
      if (quien === 'j' || (quien === 'r' && P.nivel.poderes && P.nivel.poderes.rivalCoge)) cogerPoder(P, it, quien);
    }
    // Mazos
    for (const [quien, m] of [['j', P.jug], ['r', P.riv]]) {
      const v = chocarCirculo(d, m.x, m.y, m.r, m.vx, m.vy, D.rebMazo);
      if (v > 0) {
        d.rebotes = 0; d.ultimo = quien;
        if (D.curva) d.w = D.curva * (d.x < m.x ? -1 : 1) * (quien === 'j' ? 1 : -1);
        if (quien === 'j') {
          P.golpesJugador++;
          const fb = faseBombo(P); d.contra = fb >= 0 && fb >= P.nivel.truco.desde;
        } else {
          d.contra = false;
          // Doña Cima: si para un tiro fuerte, sube a la raya a plantar la bandera
          const tr = P.nivel.truco;
          if (tr.tipo === 'cumbre' && v >= tr.vMin && P.riv.estado === 'normal' && P.t >= (P.truco.recarga || 0)) {
            P.truco.recarga = P.t + (tr.recarga || 0);
            P.riv.estado = 'cumbre'; P.riv.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen; P.ui.push({ tipo: 'cumbre' });
            // …y deja su banderita en la raya: un obstáculo pequeño (como mucho tr.banderas a la vez)
            if (tr.banderas) {
              const bx = limitar(P.A / 2 + (P.riv.x < P.A / 2 ? -0.6 : 0.6) + (P.rng() - 0.5) * 3, 1, P.A - 1);
              const ban = P.obs.filter((o) => o.id === 'bandera');
              if (ban.length >= tr.banderas) P.obs.splice(P.obs.indexOf(ban[0]), 1);
              P.obs.push({ id: 'bandera', tipo: 'fijo', x: bx, y: P.L / 2 + 0.45, r: 0.25, x0: bx, y0: P.L / 2 + 0.45, vx: 0, vy: 0 });
            }
          }
        }
        topeVel(P, d);
        P.ui.push({ tipo: 'golpe', quien, x: d.x, y: d.y, v });
      }
    }
    // Que el mazo no lo saque de la mesa: otra vez dentro de las bandas (salvo por la boca de una portería)
    d.x = limitar(d.x, d.r, A - d.r);
    const boca = (lado) => porteriasDe(P, lado, P.t).some((g) => d.x > g.a && d.x < g.b);
    if (d.y < d.r && !boca('jugador')) d.y = d.r;
    if (d.y > L - d.r && !boca('rival')) d.y = L - d.r;
    esquinas(P, d);
    topeVel(P, d);
  }
  // Dos chapas: chocan entre ellas (misma masa)
  if (P.discos.length > 1) {
    const [a, b] = P.discos;
    if (!a.fuera && !b.fuera) {
      const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), min = a.r + b.r;
      if (dist < min && dist > 0) {
        const nx = dx / dist, ny = dy / dist, sol = (min - dist) / 2;
        a.x -= nx * sol; a.y -= ny * sol; b.x += nx * sol; b.y += ny * sol;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) { const j = -(1 + P.D.rebBanda) * vn / 2; a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny; }
      }
    }
  }
}

// ── Los goles ───────────────────────────────────────────────────────────────
function trucoEnGol(P, d) {
  const tr = P.nivel.truco;
  if (tr.tipo === 'banda2') return d.ultimo === 'j' && d.rebotes >= tr.rebotes;
  if (tr.tipo === 'lento') return velocidad(d) <= tr.vMax;
  if (tr.tipo === 'contratiempo') return d.ultimo === 'j' && d.contra;
  return P.t <= P.truco.hasta;
}

function gol(P, d, quien) {
  d.fuera = true;
  let anulado = false, truco = false, vale = 1;
  const tr = P.nivel.truco;
  if (quien === 'j') {
    truco = trucoEnGol(P, d);
    if (P.poder.seguro > 0 && !truco) { P.poder.seguro--; anulado = true; }
    if (truco) { P.truco.veces++; if (!P.truco.descubierto) { P.truco.descubierto = true; P.ui.push({ tipo: 'truco' }); } }
    if (!anulado) {
      const ef = P.efectos.j;
      if (ef.grande > 0 || ef.escoba > 0 || ef.pegamento > 0 || ef.doble > 0) P.stats.poder++;
      if (ef.doble > 0) { vale = 2; ef.doble = 0; }
      if (d.ultimo === 'j' && d.rebotes >= 2) P.stats.bandas++;
      P.marcador.j = Math.min(P.nivel.goles, P.marcador.j + vale);
      if (P.nivel.encoge && P.nivel.encoge.rival) P.encoge.rival += P.nivel.encoge.rival;
    }
    // El Quinto: si le metes, le da la rabieta y sale a por todas (deja la portería)
    if (tr.tipo === 'rabieta' && !anulado) { P.riv.estado = 'rabieta'; P.riv.hasta = P.t + PATINAZO_CFG.pausaGol + tr.dura; P.truco.hasta = P.riv.hasta + tr.margen; P.ui.push({ tipo: 'rabieta' }); }
  } else {
    const ef = P.efectos.r;
    if (ef.doble > 0) { vale = 2; ef.doble = 0; }
    P.marcador.r = Math.min(P.nivel.goles, P.marcador.r + vale);
    if (P.nivel.encoge && P.nivel.encoge.jugador) P.encoge.jugador += P.nivel.encoge.jugador;
    if (tr.tipo === 'discurso') { P.riv.estado = 'discurso'; P.riv.hasta = P.t + PATINAZO_CFG.pausaGol + tr.dura; P.truco.hasta = P.riv.hasta + 0.3; }
  }
  P.ui.push({ tipo: anulado ? 'anulado' : 'gol', quien, x: d.x, truco, vale });
  P.pendientes.push({ i: d.i, en: P.t + PATINAZO_CFG.pausaGol, enJugador: quien === 'r' });
  // Los jefes: a mitad de partido cambian (fase 2)
  const fs = P.fasesJefe || (P.fasesJefe = P.nivel.fases || []), f2 = fs[P.faseJefe || 0];
  if (f2 && P.marcador.j >= f2.tras && P.marcador.j < P.nivel.goles) entrarFase(P, f2);
  const G = P.nivel.goles;
  if (P.marcador.j >= G || P.marcador.r >= G || (P.oro && P.marcador.j !== P.marcador.r)) terminar(P);
  else { P.fase = 'gol'; P.faseT = PATINAZO_CFG.pausaGol; }
}

function terminar(P) {
  const gano = P.marcador.j > P.marcador.r;
  P.fase = 'fin';
  P.resultado = { gano, j: P.marcador.j, r: P.marcador.r, paliza: gano && P.marcador.j - P.marcador.r >= PATINAZO_CFG.paliza,
    truco: P.truco.descubierto, tiempo: P.t >= P.tiempo, seg: P.t, golesPoder: P.stats.poder, golesBandas: P.stats.bandas };
  P.ui.push({ tipo: 'fin', gano });
}

// Las fases de un jefe (nivel.fases = [{ tras, frase, ia, porterias, obstaculos, zonas, inclina, poder, poderes, discos,
// seguro }]): al llegar a «tras» goles tuyos se mezclan sus cambios en una copia del nivel. Lo dice y sale en pantalla.
function entrarFase(P, f) {
  const { tras, frase, nombre, ...cambios } = f;
  const n = { ...P.nivel, ...cambios, ia: { ...P.nivel.ia, ...(f.ia || {}) } };
  P.nivel = n; P.faseJefe = (P.faseJefe || 0) + 1; P.enFase2 = true;
  radiosMazos(P);
  if (f.obstaculos) P.obs = f.obstaculos.map((o) => ({ tipo: 'fijo', ...o, x0: o.x, y0: o.y, vx: 0, vy: 0 }));
  if (f.inclina && !P.inclina) P.inclina = { dir: 1, prox: f.inclina.cada, avisada: false };
  if (f.poderes && !P.itemProx) P.itemProx = f.poderes.primero || f.poderes.cada;
  if (f.poder && f.poder.tipo === 'helada') P.poder.proxima = f.poder.cada;
  if (f.seguro) P.poder.seguro += f.seguro;
  if (f.discos && f.discos > P.discos.length) for (let i = P.discos.length; i < f.discos; i++) P.discos.push(nuevoDisco(P, i, false));
  P.ui.push({ tipo: 'fase', n: P.faseJefe + 1, frase, nombre });
}

// El tamaño de cada mazo con los poderes: el corcho gordo agranda el tuyo; el pegamento encoge el del otro.
function radiosMazos(P) {
  const ej = P.efectos.j, er = P.efectos.r;
  P.jug.r = PATINAZO_CFG.mazo.r * (ej.grande > 0 ? PODERES.grande.factor : 1) * (er.pegamento > 0 ? PODERES.pegamento.factor : 1);
  P.riv.r = P.nivel.ia.rMazo * (er.grande > 0 ? PODERES.grande.factor : 1) * (ej.pegamento > 0 ? PODERES.pegamento.factor : 1);
}
// Los poderes (PODERES en niveles.js): quien lo coge lo tiene unos segundos.
function cogerPoder(P, it, quien) {
  P.items.splice(P.items.indexOf(it), 1);
  P.itemProx = P.nivel.poderes ? P.nivel.poderes.cada : 99;
  const def = PODERES[it.tipo], ef = P.efectos[quien];
  ef[it.tipo] = def.dura;
  radiosMazos(P);
  if (quien === 'j') P.stats.poderes++;
  P.ui.push({ tipo: 'poder', poder: it.tipo, quien, x: it.x, y: it.y });
}
// La ofrenda de La Yonkilata (en tu mitad: si tu tiro pasa por la chapa, va flotando a por ella hasta la raya) y la
// pizza de El Turbio (en su mitad: si tu disco la toca, se va a defenderla). En los dos casos, deja la portería.
function cogerTrucoItem(P, it) {
  P.items.splice(P.items.indexOf(it), 1);
  const tr = P.nivel.truco; P.ofrendaProx = tr.cada;
  if (P.riv.estado !== 'normal') return;
  P.riv.estado = it.tipo; P.riv.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen;
  P.riv.meta = { x: limitar(it.x, P.riv.r, P.A - P.riv.r), y: Math.max(P.L / 2 + P.riv.r, it.y) };
  P.ui.push({ tipo: it.tipo, x: it.x, y: it.y });
}
// Un sitio libre para un poder o lo de un truco (lejos de los obstáculos): en la franja y0-y1 (por defecto, el centro)
function sitioItem(P, y0, y1) {
  if (y0 == null) { y0 = P.L / 2 - 3; y1 = P.L / 2 + 3; }
  for (let k = 0; k < 12; k++) {
    const x = 1.4 + P.rng() * (P.A - 2.8), y = y0 + P.rng() * (y1 - y0);
    if (P.obs.every((o) => Math.hypot(o.x - x, o.y - y) > o.r + 0.9)) return { x, y };
  }
  return { x: P.A / 2, y: P.L / 2 };
}
// Los temporizadores de cada fotograma: poderes que salen y se acaban, ofrendas, la llamada de La Cero y la mesa coja.
function relojes(P, dt) {
  const n = P.nivel;
  for (const q of ['j', 'r']) {
    const ef = P.efectos[q];
    for (const k of ['grande', 'escoba', 'pegamento', 'doble']) if (ef[k] > 0) {
      ef[k] -= dt;
      if (ef[k] <= 0) { ef[k] = 0; radiosMazos(P); P.ui.push({ tipo: 'fin-poder', poder: k, quien: q }); }
    }
  }
  if (P.fase !== 'jugando') return;
  for (const it of P.items.slice()) if (P.t >= it.hasta) { P.items.splice(P.items.indexOf(it), 1); if (esTrucoItem(it.tipo)) P.ofrendaProx = n.truco.cada; else P.itemProx = n.poderes ? n.poderes.cada : 99; }
  if (n.poderes && !P.items.some((i) => !esTrucoItem(i.tipo))) {
    P.itemProx -= dt;
    if (P.itemProx <= 0) {
      const tipos = n.poderes.tipos, s = sitioItem(P);
      P.items.push({ tipo: tipos[Math.floor(P.rng() * tipos.length)], x: s.x, y: s.y, hasta: P.t + n.poderes.dura, desde: P.t });
      P.itemProx = 99; P.ui.push({ tipo: 'sale-poder' });
    }
  }
  if (esTrucoItem(n.truco.tipo) && !P.items.some((i) => esTrucoItem(i.tipo))) {
    P.ofrendaProx -= dt;
    if (P.ofrendaProx <= 0) {
      const tr = n.truco, z = tr.zona || [3, 7], s = sitioItem(P, z[0], z[1]);
      P.items.push({ tipo: tr.tipo, x: s.x, y: s.y, r: tr.r, hasta: P.t + tr.vida, desde: P.t }); P.ofrendaProx = 99;
      P.ui.push({ tipo: 'sale-' + tr.tipo });
    }
  }
  if (P.llamada && n.truco.tipo === 'llamada') {
    const tr = n.truco, L = P.llamada;
    L.prox -= dt;
    if (L.prox <= tr.aviso && !L.avisada) { L.avisada = true; P.ui.push({ tipo: 'aviso-llamada' }); }
    if (L.prox <= 0) {
      L.prox = tr.cada + P.rng() * (tr.varia || 0); L.avisada = false;
      if (P.riv.estado === 'normal') { P.riv.estado = 'llamada'; P.riv.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen; P.ui.push({ tipo: 'llamada' }); }
    }
  }
  if (P.inclina && n.inclina) {
    const I = P.inclina; I.prox -= dt;
    if (I.prox <= (n.inclina.aviso || 1) && !I.avisada) { I.avisada = true; P.ui.push({ tipo: 'aviso-inclina', dir: -I.dir }); }
    if (I.prox <= 0) { I.dir = -I.dir; I.prox = n.inclina.cada; I.avisada = false; P.ui.push({ tipo: 'inclina', dir: I.dir }); }
  }
}

// Lo que queda de partido (s). Al acabar el tiempo gana el que va por delante; si van empatados, gol de oro.
function quedaTiempo(P) { return Math.max(0, P.tiempo - P.t); }

// Cómo pegar al disco para mandarlo hacia (ax, ay): ponerse detrás, en la línea, y pasar a través. Si el mazo está
// delante, rodea el disco por un lado (para no meterlo hacia atrás). Lo usan la IA y el bot.
function apuntar(m, d, ax, ay, pasa = 1.8, holgura = 0.3) {
  const px = d.x + d.vx * 0.06, py = d.y + d.vy * 0.06;
  let ux = ax - px, uy = ay - py; let l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
  // El golpe sólo cambia la velocidad en la dirección del choque: para que salga hacia u, se pega en la dirección
  // de (u·16 − v), que descuenta lo que el disco ya traía.
  ux = ux * 16 - d.vx; uy = uy * 16 - d.vy; l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
  const rx = m.x - px, ry = m.y - py, along = rx * ux + ry * uy, perp = rx * -uy + ry * ux, suma = d.r + m.r;
  if (along < -suma * 0.5 && Math.abs(perp) < holgura) return { x: px + ux * pasa, y: py + uy * pasa, pega: true };
  if (along > -suma * 0.3 && Math.abs(perp) < suma + 0.15) {
    const lado = perp >= 0 ? 1 : -1;
    return { x: px - uy * lado * (suma + 0.4) - ux * 0.4, y: py + ux * lado * (suma + 0.4) - uy * 0.4, pega: false };
  }
  return { x: px - ux * (suma + 0.45), y: py - uy * (suma + 0.45), pega: false };
}

// ── La IA ───────────────────────────────────────────────────────────────────
// Dónde cruzará el disco la línea y = yObj, sabiendo prever como mucho «rebotes» rebotes en las bandas. Si hacen falta
// más, se equivoca: se queda con la x sin rebotar (cortada a la mesa), como quien no lo ve venir.
function predecirX(P, d, yObj, rebotes) {
  if (Math.abs(d.vy) < 0.05) return null;
  const tt = (yObj - d.y) / d.vy; if (tt < 0) return null;
  const lo = d.r, hi = P.A - d.r, w = hi - lo;
  const xLibre = d.x + d.vx * tt;
  const u = xLibre - lo, n = u < 0 ? Math.ceil(-u / w) : Math.floor(u / w);
  if (n > rebotes) return limitar(xLibre, lo, hi);
  let m = ((u % (2 * w)) + 2 * w) % (2 * w);
  if (m > w) m = 2 * w - m;
  return lo + m;
}

// Como predecirX, pero sin límite de rebotes y con la vx con la que llega (para el bot).
function predecirEstado(P, d, yObj) {
  if (Math.abs(d.vy) < 0.05) return null;
  const tt = (yObj - d.y) / d.vy; if (tt < 0) return null;
  const lo = d.r, hi = P.A - d.r, w = hi - lo, u = d.x + d.vx * tt - lo;
  let m = ((u % (2 * w)) + 2 * w) % (2 * w); const ida = m <= w; if (!ida) m = 2 * w - m;
  return { x: lo + m, vx: ida ? d.vx : -d.vx };
}

function discoPeligroso(P) {
  let mejor = null, nota = -1e9;
  for (const d of P.discos) {
    if (d.fuera) continue;
    const s = (d.y - P.L / 2) + (d.vy > 0 ? d.vy * 0.6 : 0);
    if (s > nota) { nota = s; mejor = d; }
  }
  return mejor;
}

function iaPensar(P) {
  const R = P.riv, I = P.nivel.ia, tr = P.nivel.truco, A = P.A, L = P.L, rng = P.rng;
  const gs = porteriasDe(P, 'rival', P.t), gj = porteriasDe(P, 'jugador', P.t);
  const d = discoPeligroso(P);
  const casa = (x) => { R.ox = x; R.oy = I.defY; };
  // Los estados del truco mandan
  if (R.estado !== 'normal' && P.t > R.hasta) {
    // El Brother se va y vuelve Don Filtrado, que no sabe qué ha pasado (un ratito despistado)
    if (R.estado === 'brother' && tr.confuso) { R.estado = 'confuso'; R.hasta = P.t + tr.confuso; P.ui.push({ tipo: 'confuso' }); }
    else R.estado = 'normal';
  }
  if (R.estado === 'engañado') { R.ox = P.jug.x; R.oy = L / 2 + R.r; return; }
  if (R.estado === 'contando') { R.ox = R.x; R.oy = R.y; return; }
  if (R.estado === 'discurso') { R.ox = A - R.r - 0.1; R.oy = L - R.r - 0.1; return; }
  if (R.estado === 'vendiendo') { if (d) { R.ox = d.x + (d.x < A / 2 ? 0.9 : -0.9); R.oy = L / 2 + R.r + 0.15; } return; }
  if (R.estado === 'llamada') { R.ox = R.x; R.oy = R.y; return; } // «Papá…»: se gira a hablar
  if (R.estado === 'cumbre') { R.ox = A / 2 + (R.x < A / 2 ? -0.6 : 0.6); R.oy = L / 2 + R.r + 0.1; return; } // planta la bandera en la raya
  if ((R.estado === 'ofrenda' || R.estado === 'pizza') && R.meta) { R.ox = R.meta.x; R.oy = R.meta.y; return; }
  if (R.estado === 'confuso') { R.ox = R.x + (gs[0].x - R.x) * 0.2; R.oy = R.y; return; } // «¿Qué ha pasado?»
  if ((R.estado === 'rabieta' || R.estado === 'brother') && d) { // a lo loco: a por el disco hasta la raya, sin defender
    if (d.y > L / 2 + 0.2) { const o = apuntar(R, d, gj[0].x + (rng() - 0.5) * 3, -2, 1.6, 0.6); R.ox = o.x; R.oy = o.y; R.ataca = true; }
    else { R.ox = d.x + (R.estado === 'brother' ? (rng() - 0.5) * 2 : 0); R.oy = L / 2 + R.r; R.ataca = true; }
    return;
  }
  if (!d) { casa(gs[0].x); return; }
  // El amago (El Chafao): si tu mazo arranca hacia la raya lejos del disco, se lo cree.
  if (tr.tipo === 'amago' && P.jug.vy > tr.vAmago && P.jug.y > L / 2 - 3.5 && Math.hypot(d.x - P.jug.x, d.y - P.jug.y) > tr.distDisco) {
    R.estado = 'engañado'; R.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen; P.ui.push({ tipo: 'engañado' });
    R.ox = P.jug.x; R.oy = L / 2 + R.r; return;
  }
  // Son tres chapas (El Litri): el disco quieto en la raya le puede.
  if (tr.tipo === 'vender' && velocidad(d) < tr.vMax && Math.abs(d.y - L / 2) < tr.zona) {
    d.paradoRaya = (d.paradoRaya || 0) + I.reaccion;
    if (d.paradoRaya >= tr.espera) {
      d.paradoRaya = 0; R.estado = 'vendiendo'; R.hasta = P.t + tr.dura; P.truco.hasta = P.t + tr.dura + tr.margen; P.ventas++;
      P.ui.push({ tipo: 'vendiendo' }); return;
    }
  } else d.paradoRaya = 0;
  // La portería que defiende: la más cercana al disco
  const g = gs.reduce((m, x) => (Math.abs(x.x - d.x) < Math.abs(m.x - d.x) ? x : m), gs[0]);
  // El Barril: se planta en media portería y cada rato se cambia de lado (y tarda).
  if (I.estilo === 'medio') {
    if (R.estado === 'cambiando') { casa(g.x + R.lado * (g.b - g.a) * 0.25); if (Math.abs(R.x - R.ox) < 0.15) { R.estado = 'normal'; } else return; }
    R.cambio -= I.reaccion;
    if (R.cambio <= 0) { R.cambio = I.cambioCada; R.lado = -R.lado; R.estado = 'cambiando'; R.hasta = P.t + 99; P.ui.push({ tipo: 'cambio' }); casa(g.x + R.lado * (g.b - g.a) * 0.25); return; }
  }
  const v = velocidad(d);
  // Ataque: el disco en su campo, flojo o alejándose, y le da por salir
  const enSuCampo = d.y > L / 2 + 0.2;
  d.enRival = enSuCampo ? (d.enRival || 0) + I.reaccion : 0;
  if (enSuCampo && d.vy > -2.5 && (v < 4.5 || d.vy < 2.5) && (rng() < I.ataque || d.enRival > 1.5)) {
    const meta = gj[Math.floor(rng() * gj.length)];
    const ax = meta.x + (rng() - 0.5) * 2, ay = -2;
    const o = apuntar(R, d, ax, ay, 1.6, 0.35 + I.error * 0.3);
    R.ox = o.x; R.oy = o.y; R.ataca = o.pega;
    return;
  }
  R.ataca = false;
  // La Congelada sólo para lo rápido
  if (tr.tipo === 'lento' && v <= tr.vMax && Math.hypot(d.x - R.x, d.y - R.y) > tr.cerca) { casa(g.x + (d.x - g.x) * 0.3); return; }
  if (d.vy > 0.3) {
    const px = predecirX(P, d, I.defY, I.rebotes);
    let x = px == null ? d.x : px;
    x += (rng() - 0.5) * 2 * I.error;
    if (I.estilo === 'medio') x = limitar(x, g.x + Math.min(0, R.lado) * (g.b - g.a) * 0.25 - 0.3, g.x + Math.max(0, R.lado) * (g.b - g.a) * 0.25 + 0.3);
    R.ox = limitar(x, g.a - 0.3, g.b + 0.3); R.oy = I.defY;
    // Los buenos no sólo paran: se colocan girados para devolverlo hacia tu portería (con su error)
    const e = predecirEstado(P, d, I.defY);
    if (I.devuelve && d.vy > 2 && e && px != null && Math.abs(e.x - px) < 0.01 && rng() < I.devuelve) {
      const meta = gj[Math.floor(rng() * gj.length)], mx = meta.x + (rng() - 0.5) * (meta.b - meta.a) * 0.8 + (rng() - 0.5) * 2 * I.error;
      let ux = mx - e.x, uy = -1 - I.defY; const l = Math.hypot(ux, uy); ux /= l; uy /= l;
      const sp = Math.hypot(e.vx, d.vy) * P.D.rebMazo;
      let nx = ux * sp - e.vx, ny = uy * sp - d.vy; const ln = Math.hypot(nx, ny) || 1; nx /= ln; ny /= ln;
      const suma = (d.r + R.r) * 0.98;
      R.ox = e.x - nx * suma; R.oy = I.defY - ny * suma;
    }
    return;
  }
  const base = I.estilo === 'medio' ? g.x + R.lado * (g.b - g.a) * 0.25 : g.x;
  casa(base + (d.x - base) * 0.35);
}

function iaPaso(P, h) {
  const R = P.riv, I = P.nivel.ia;
  R.piensa -= h;
  if (R.piensa <= 0) { R.piensa = I.reaccion; iaPensar(P); }
  let vmax = R.ataca ? I.vTiro : I.vmax;
  if (R.estado === 'cambiando') { vmax = I.vCambio; P.truco.hasta = P.t + P.nivel.truco.margen; }
  if (R.estado === 'contando' || R.estado === 'vendiendo') vmax = Math.min(vmax, 5);
  if (R.estado === 'engañado') vmax = I.vmax * 1.4;
  if (R.estado === 'llamada' || R.estado === 'confuso') vmax = I.vmax * 0.3;
  if (R.estado === 'ofrenda') vmax = Math.min(vmax, 3.5); // va flotando, sin prisa
  if (R.estado === 'rabieta' || R.estado === 'brother') vmax = Math.max(I.vTiro, I.vmax * 1.3);
  if (P.efectos.j.pegamento > 0) vmax *= PODERES.pegamento.vel;
  const pd = P.nivel.poder;
  if (pd && pd.tipo === 'temazo' && faseBombo(P) >= pd.mueve) vmax = 0; // entre golpe y golpe, palmas
  moverMazo(P, R, R.ox, R.oy, vmax, h, true);
}

// ── Un fotograma de partida ─────────────────────────────────────────────────
// dedo: { x, y } en unidades de mesa (donde quieres el mazo) o null (se queda).
function pasoPartida(P, dedo) {
  const C = PATINAZO_CFG, dt = C.paso, n = C.subpasos, h = dt / n;
  if (P.fase === 'fin') return;
  if (P.fase === 'gol') {
    P.faseT -= dt;
    if (P.faseT <= 0) P.fase = 'jugando';
  }
  // Los discos que vuelven tras un gol
  for (const pdt of P.pendientes.slice()) {
    if (P.t >= pdt.en) { P.discos[pdt.i] = nuevoDisco(P, pdt.i, pdt.enJugador); P.pendientes.splice(P.pendientes.indexOf(pdt), 1); }
  }
  const pd = P.nivel.poder;
  // La helada de La Congelada: tu mazo resbala
  if (pd && pd.tipo === 'helada') {
    if (P.poder.helada > 0) P.poder.helada -= dt;
    P.poder.proxima -= dt;
    if (P.poder.proxima <= pd.aviso && !P.poder.avisada) { P.poder.avisada = true; P.ui.push({ tipo: 'aviso-helada' }); }
    if (P.poder.proxima <= 0) { P.poder.proxima = pd.cada; P.poder.helada = pd.dura; P.poder.avisada = false; P.ui.push({ tipo: 'helada' }); }
  }
  // El ¡TEMAZO! de La Chunda: cada tantos golpes de bombo, la mesa salta
  if (pd && pd.tipo === 'temazo') {
    const golpe = Math.floor(P.t / (60 / pd.bpm));
    if (golpe !== P.poder.golpes) {
      P.poder.golpes = golpe; P.ui.push({ tipo: 'bombo', n: golpe });
      if (golpe > 0 && golpe % pd.cadaGolpes === 0 && P.fase === 'jugando') {
        for (const d of P.discos) if (!d.fuera) { const a = P.rng() * Math.PI * 2; d.vx += Math.cos(a) * pd.empuje; d.vy += Math.sin(a) * pd.empuje; }
        P.ui.push({ tipo: 'temazo' });
      }
    }
  }
  relojes(P, dt);
  let vJug = P.poder.helada > 0 ? pd.vmax : C.mazo.vmax;
  if (P.vmaxJug) vJug = Math.min(vJug, P.vmaxJug);
  if (P.efectos.r.pegamento > 0) vJug *= PODERES.pegamento.vel;
  if (dedo) { P.jug.ox = dedo.x; P.jug.oy = dedo.y; }
  for (let k = 0; k < n; k++) {
    moverMazo(P, P.jug, P.jug.ox, P.jug.oy, vJug, h, false);
    if (P.fase === 'jugando') { if (P.obs.length) moverObstaculos(P, P.t); iaPaso(P, h); fisica(P, h); }
    else moverMazo(P, P.riv, P.riv.x, P.nivel.ia.defY, P.nivel.ia.vmax, h, true);
    P.t += h;
    if (P.fase === 'fin') break;
  }
  // Se acaba el tiempo
  if (P.fase !== 'fin' && !P.oro && P.t >= P.tiempo) {
    if (P.marcador.j !== P.marcador.r) terminar(P);
    else { P.oro = true; P.ui.push({ tipo: 'oro' }); }
  }
  // Atascos: un disco casi quieto mucho rato, empujoncito hacia el centro
  for (const d of P.discos) {
    if (d.fuera) continue;
    d.quieto = velocidad(d) < C.vQuieto ? d.quieto + dt : 0;
    if (d.quieto > C.atasco.seg) {
      d.quieto = 0; const dx = P.A / 2 - d.x, dy = P.L / 2 - d.y, l = Math.hypot(dx, dy) || 1;
      d.vx += (dx / l) * C.atasco.empuje; d.vy += (dy / l) * C.atasco.empuje; P.ui.push({ tipo: 'atasco', x: d.x, y: d.y });
    }
  }
}

// Las estrellas de una partida: ganar, ganar de paliza y descubrir el truco (cada una se gana una vez por rival).
function estrellasDe(res) { return { gano: !!res.gano, paliza: !!res.paliza, truco: !!res.truco }; }
function cuentaEstrellas(e) { return (e && ((e.gano ? 1 : 0) + (e.paliza ? 1 : 0) + (e.truco ? 1 : 0))) || 0; }

// Las 3 estrellas de un nivel de los 50 (DISENO-50.md §4): ★ ganar + sus 2 retos (nivel.retos). Los que piden ganar
// (paliza, encaja, rapido) sólo cuentan si ganas; truco, poder y bandas, aunque pierdas (son hazañas).
function cumpleReto(reto, res) {
  const r = typeof reto === 'string' ? { tipo: reto } : reto;
  if (r.tipo === 'paliza') return !!res.gano && res.j - res.r >= (r.n || PATINAZO_CFG.paliza);
  if (r.tipo === 'encaja') return !!res.gano && res.r <= r.max;
  if (r.tipo === 'rapido') return !!res.gano && res.seg <= r.seg;
  if (r.tipo === 'truco') return !!res.truco && (res.trucos == null || res.trucos >= (r.n || 1));
  if (r.tipo === 'poder') return (res.golesPoder || 0) >= (r.n || 1);
  if (r.tipo === 'bandas') return (res.golesBandas || 0) >= (r.n || 1);
  return false;
}
function estrellasNivel(nivel, res) { return [!!res.gano, ...(nivel.retos || ['paliza', 'truco']).map((x) => cumpleReto(x, res))]; }

// ── El guardado (patinazo:v2): { v: 2, niveles: { id: [★1, ★2, ★3] }, mejor: { id }, trucos: { rival: true }, sonido,
// abiertos } («abiertos»: hasta qué nivel está abierto aunque no se haya ganado el anterior; sale de la migración).
function guardadoVacio() { return { v: 2, niveles: {}, mejor: {}, trucos: {}, sonido: true, abiertos: 0 }; }
// El de la escalera de 8 (patinazo:v1: rivales[id] = { gano, paliza, truco, mejor }) pasa al nuevo sin perder nada: los
// 8 niveles conservan su id y sus retos son ★2 truco y ★3 paliza; se abre hasta el siguiente al más lejano ganado.
function migrarGuardado(v1) {
  const g = guardadoVacio(), r = (v1 && v1.rivales) || {};

  let lejos = -1;
  NIVELES.forEach((n, i) => {
    const l = r[n.id]; if (!l) return;
    g.niveles[n.id] = [!!l.gano, !!(l.truco || l.pendienteTruco), !!l.paliza];
    if (l.mejor) g.mejor[n.id] = l.mejor;
    if (l.truco || l.pendienteTruco) g.trucos[n.rival || n.id] = true;

function apuntarPartida(g, n, res) {

  if (res.truco) g.trucos[n.rival || n.id] = true;

// ── El bot (para las pruebas y la demo): defiende, se pone detrás del disco y tira a la portería ─────────
// conTruco: además, intenta el truco del nivel (sólo lo que una persona podría hacer con el dedo).
function botDedo(P, conTruco = false, estado = {}) {
  const J = P.jug, A = P.A, L = P.L, tr = P.nivel.truco;

    // Arranca hacia la raya lejos del disco

  }
  if (estado.amagado && P.riv.estado === 'normal' && J.y > L / 2 - 2) { if (P.t > (estado.tAmago || 0) + 1.5) { estado.amagado = false; } }
  if (conTruco && tr.tipo === 'vender' && d.y < L / 2 + 0.5 && Math.abs(d.y - L / 2) < 1.2 && P.riv.estado !== 'vendiendo' && velocidad(d) < 1.5 && (estado.esperando || 0) < 3) {
    estado.esperando = (estado.esperando || 0) + PATINAZO_CFG.paso; return { x: d.x < A / 2 ? A - 1 : 1, y: 1.5 };
  }
  if (P.riv.estado === 'vendiendo') estado.esperando = 0;
  // Trucos que se hacen apuntando a algo de la mesa: la regadera de Don Filtrado, la ofrenda de La Yonkilata, los poderes
  if (conTruco && P.riv.estado === 'normal' && op !== 1) {
    const reg = tr.tipo === 'riego' && P.obs.find((o) => o.id === 'regadera');
    const ofr = P.items.find((i) => esTrucoItem(i.tipo) || op === 2);
    if (reg) { ax = reg.x; ay = reg.y; } else if (ofr && ofr.y > d.y + 1) { ax = ofr.x + (ofr.x - d.x) * 0.6; ay = ofr.y + (ofr.y - d.y) * 0.6; }
  }

  // Viene rápido: se pone donde va a pasar, girado para devolverlo hacia la meta (el choque refleja en la normal)
  const yC = 2.6;
  if (d.vy < -2) {
    if (d.y > yC + 0.5) {
      const e = predecirEstado(P, d, yC);
      if (e) {
        let ux = ax - e.x, uy = ay - yC; const l = Math.hypot(ux, uy); ux /= l; uy /= l;
        const sp = Math.hypot(e.vx, d.vy) * P.D.rebMazo;
        let nx = ux * sp - e.vx, ny = uy * sp - d.vy; const ln = Math.hypot(nx, ny) || 1; nx /= ln; ny /= ln;

    const e = predecirEstado(P, d, J.r + 0.05);

// Juega una partida entera con el bot. Devuelve el resultado (o null si se pasa de «maxSeg»).
// perfil (opcional, para medir la dificultad como la sufriría una persona; BOT_PERFILES en niveles.js): piensa = cada
// cuánto mira la mesa (s), error = lo que falla al poner el dedo (u), vmax = lo rápido que mueve el dedo (u/s).
function jugarConBot(nivel, semilla = 1, conTruco = false, maxSeg = 600, perfil = null) {
  const P = crearPartida(nivel, semilla, perfil && perfil.vmax ? { vmaxJug: perfil.vmax } : {}), est = { lado: 0 };

  for (let i = 0; i < pasos && P.fase !== 'fin'; i++) {
    if (i % 150 === 0) est.lado = (est.lado + 1) % 3;
    if (!perfil) dedo = botDedo(P, conTruco, est);
    else {
      piensa -= PATINAZO_CFG.paso;
      if (piensa <= 0 || !dedo) {
        piensa = perfil.piensa * (0.7 + rb() * 0.6);
        const o = botDedo(P, conTruco, est), e = perfil.error;
        dedo = { x: o.x + (rb() - 0.5) * 2 * e, y: o.y + (rb() - 0.5) * 2 * e };
      }
    }
    pasoPartida(P, dedo); P.ui.length = 0;
  }
  return P.resultado ? { ...P.resultado, t: P.t, ventas: P.ventas, trucos: P.truco.veces } : null;
}

// ===== Tocar: el mazo va al dedo (un poco por encima, para verlo) =====
function aMesa(px, py) {
  return { x: (px - ox) / esc, y: PATINAZO_CFG.mesa.largo - (py - oy) / esc + PATINAZO_CFG.mazo.dedoArriba };
}
// Control relativo (PATINAZO_CFG.control): al poner el dedo el mazo NO salta; se mueve lo que se mueve el dedo.
// Si el mazo topa con el borde de su mitad, el ancla se corre para que al volver responda al momento (sin zona muerta).
let ancla = null;
function objetivoRelativo(t) {
  const m = P.jug, C = PATINAZO_CFG, s = (C.control && C.control.sensibilidad) || 1;
  const xMin = m.r, xMax = P.A - m.r, yMin = m.r, yMax = P.L / 2 - m.r;
  let x = ancla.mx + (t.x - ancla.dx) * s, y = ancla.my + (t.y - ancla.dy) * s;
  const cx = Math.min(xMax, Math.max(xMin, x)), cy = Math.min(yMax, Math.max(yMin, y));
  if (cx !== x) ancla.dx += (x - cx) / s;
  if (cy !== y) ancla.dy += (y - cy) / s;
  return { x: cx, y: cy };
}
const esRelativo = () => !PATINAZO_CFG.control || PATINAZO_CFG.control.modo !== 'absoluto';
lienzo.addEventListener('pointerdown', (e) => {
  if (estado !== 'jugando') return;
  const t = aMesa(e.clientX, e.clientY);
  if (esRelativo() && P && P.jug) {
    ancla = { dx: t.x, dy: t.y, mx: P.jug.x, my: P.jug.y };
    dedo = { x: P.jug.x, y: P.jug.y };
  } else dedo = t;
  try { lienzo.setPointerCapture(e.pointerId); } catch (er) {}
  if (audio && audio.state === 'suspended') audio.resume();
});
lienzo.addEventListener('pointermove', (e) => {
  if (estado !== 'jugando' || !(e.buttons || e.pointerType === 'touch')) return;
  const t = aMesa(e.clientX, e.clientY);
  dedo = esRelativo() && ancla ? objetivoRelativo(t) : t;
});
const soltar = () => { ancla = null; };
lienzo.addEventListener('pointerup', soltar);
lienzo.addEventListener('pointercancel', soltar);

  if (x.tipo === 'encaja') return r.gano ? `encajaste ${r.r}` : 'no ganaste';
  if (x.tipo === 'rapido') return r.gano ? `tardaste ${Math.round(r.seg)} s` : 'no ganaste';
  if (x.tipo === 'truco') return 'esta vez no';

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#8a5f2a55'; const s = semilla(5); for (let i = 0; i < 14; i++) { const a = s() * 6.28, d = s() * r * 0.8; ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * 0.06, 0, 6.283); ctx.fill(); }
    ctx.strokeStyle = '#f2a33a'; ctx.lineWidth = Math.max(2, r * 0.12); ctx.beginPath(); ctx.arc(x, y, r * 0.95, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#d9a866'; ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#8a5f2a'; ctx.lineWidth = 1.5; ctx.stroke();
    if (P.poder.helada > 0) { ctx.strokeStyle = '#bfe8ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r * 1.12, 0, 6.283); ctx.stroke(); }
    if (P.efectos.j.doble > 0) { ctx.fillStyle = '#f5c542'; ctx.font = `900 ${Math.round(esc * 0.55)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('×2', x, y - r - esc * 0.35); }
  } else {
    const col = n.color;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffffff30'; ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.25, r * 0.55, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * 0.95, 0, 6.283); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#00000055'; ctx.stroke();
    if (n.ia.estilo === 'medio' && P.riv.estado === 'cambiando') { ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(esc * 0.5)}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('ñiiic', x, y - r - 6); }
    if (P.efectos.r.doble > 0) { ctx.fillStyle = '#ff8a80'; ctx.font = `900 ${Math.round(esc * 0.55)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('×2', x, y + r + esc * 0.35); }
  }
  // el pegamento: gotas blancas en el mazo pegado
  if ((esRival && P.efectos.j.pegamento > 0) || (!esRival && P.efectos.r.pegamento > 0)) { for (let i = 0; i < 4; i++) { const a = i * 1.57 + 0.4; circulo(ctx, x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, r * 0.22, '#f4f4f4dd'); } }
}

function oscurecer(hex, k) {
  const v = parseInt(hex.slice(1, 7), 16), f = (c) => Math.round(c * (1 - k)).toString(16).padStart(2, '0');
  return '#' + f((v >> 16) & 255) + f((v >> 8) & 255) + f(v & 255);
}
function pintarMarcador() {
  const n = P.nivel, A = PATINAZO_CFG.mesa.ancho, L = PATINAZO_CFG.mesa.largo, C = PANTALLA_CFG.marcador, M = MESAS[n.mesa];
  const ym = sy(L / 2), xm = sx(A) - esc * C.lado;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = n.penumbra ? Math.min(1, C.opacidad * 1.6) : C.opacidad; ctx.font = `900 ${Math.round(esc * C.tam)}px system-ui`;
  // En las mesas claras y frías (nevera, iglesia, Polo…) el color de las rayas, tan flojo, no se lee: va oscurecido.
  const tinta = M.neon ? '#ffffff' : oscurecer(M.linea, C.oscurece);
  ctx.fillStyle = tinta; ctx.fillText(String(P.marcador.r), xm, ym - esc * C.separa);
  ctx.fillText(String(P.marcador.j), xm, ym + esc * C.separa);
  const q = quedaTiempo(P), txt = P.oro ? 'ORO' : `${Math.floor(q / 60)}:${String(Math.floor(q % 60)).padStart(2, '0')}`;
  const prisa = P.oro || q < C.prisaSeg;
  ctx.globalAlpha = prisa ? Math.min(1, C.opacidad * 1.8) : C.opacidad;
  ctx.font = `800 ${Math.round(esc * C.tamTiempo)}px system-ui`;
  ctx.fillStyle = prisa ? '#d9901a' : tinta; ctx.fillText(txt, sx(0) + esc * C.lado, ym - esc * 0.55);
  ctx.restore();
}

function pintarRival() {
  const n = P.nivel, L = PATINAZO_CFG.mesa.largo, tam = Math.min(oy - 6, esc * 3.2), R = P.riv, ahora = performance.now() / 1000;
  // la figura sigue a su mazo, pero sin meterse debajo de «‹ Mapa» ni del sonido (arriba a cada lado)
  const x = Math.max(tam * 0.4 + 96, Math.min(W - tam * 0.4 - 58, sx(R.x))), y = sy(L) - esc * 0.45 - tam * 0.92;
  const fig = R.estado === 'brother' && n.alter ? n.alter : n.figura, im = imgs[fig];
  let bote = R.estado === 'discurso' ? Math.sin(P.t * 10) * 2 : n.poder && n.poder.tipo === 'temazo' ? -Math.abs(Math.sin(faseBombo(P) * Math.PI)) * 5 : 0;
  if (n.rival === 'yonkilata') bote += Math.sin(P.t * 2.2) * 3; // flota
  const tiembla = R.estado === 'rabieta' ? (Math.random() - 0.5) * 4 : 0;
  if (R.estado === 'rabieta') { const g = ctx.createRadialGradient(x, y + tam / 2, 2, x, y + tam / 2, tam * 0.6); g.addColorStop(0, '#ff3b2f88'); g.addColorStop(1, '#ff3b2f00'); ctx.fillStyle = g; ctx.fillRect(x - tam, y - tam * 0.2, tam * 2, tam * 1.4); }
  if (im && im.complete) ctx.drawImage(im, x - tam / 2 + tiembla, y + bote, tam, tam);
  if (R.estado === 'brother') for (let i = 0; i < 6; i++) { const a = P.t * 7 + i * 1.05; ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2; ctx.beginPath(); const cx = x + Math.cos(a) * tam * 0.5, cy = y + tam * 0.5 + Math.sin(a) * tam * 0.45; ctx.moveTo(cx, cy); ctx.lineTo(cx + 4, cy - 6); ctx.lineTo(cx + 1, cy - 6); ctx.lineTo(cx + 5, cy - 12); ctx.stroke(); }
  if ((ahora < avisoLlamada && Math.sin(ahora * 30) > 0) || R.estado === 'llamada') { circulo(ctx, x + tam * 0.3, y + tam * 0.3, Math.max(4, tam * 0.07), '#5fd35f'); }
  if (R.estado === 'cumbre') { ctx.strokeStyle = '#3b3833'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + tam * 0.35, y + tam * 0.1); ctx.lineTo(x + tam * 0.35, y - tam * 0.3); ctx.stroke(); ctx.fillStyle = '#e8742a'; ctx.beginPath(); ctx.moveTo(x + tam * 0.35, y - tam * 0.3); ctx.lineTo(x + tam * 0.65, y - tam * 0.2); ctx.lineTo(x + tam * 0.35, y - tam * 0.1); ctx.fill(); }
  if (bocadillo && ahora < bocadillo.hasta) {
    ctx.font = `700 ${Math.round(Math.max(13, Math.min(15, W / 28)))}px system-ui`;
    const libreD = W - (x + tam * 0.42) - 8, libreI = x - tam * 0.42 - 8, derecha = libreD >= libreI;
    const maxW = Math.max(120, Math.min(260, derecha ? libreD : libreI)), lineas = partir(bocadillo.txt, maxW - 18), lh = 17;
    const bw = Math.min(maxW, Math.max(...lineas.map((l) => ctx.measureText(l).width)) + 18), bh = lineas.length * lh + 10;
    let bx = derecha ? x + tam * 0.42 : x - tam * 0.42 - bw, by = Math.max(54, y + tam * 0.35 - bh / 2);
    bx = Math.max(6, Math.min(W - 6 - bw, bx));
    ctx.fillStyle = '#fffaf0'; rrect(bx, by, bw, bh, 10); ctx.fill();
    ctx.beginPath(); const px = derecha ? bx : bx + bw, py = by + bh / 2; ctx.moveTo(px, py - 6); ctx.lineTo(px + (derecha ? -8 : 8), py); ctx.lineTo(px, py + 6); ctx.fill();
    ctx.fillStyle = '#2a1d12'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lineas.forEach((l, i) => ctx.fillText(l, bx + 10, by + 6 + i * lh));
  }
}
function partir(txt, maxW) {
  const out = []; let l = '';
  for (const p of txt.split(' ')) { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = p; } else l = t; }
  if (l) out.push(l); return out;
}
// La penumbra (El Turbio, El Altillo): todo oscuro salvo un círculo de luz alrededor de los discos y de tu mazo
function pintarPenumbra(k) {
  if (!sombra) { sombra = document.createElement('canvas'); sombra.width = lienzo.width; sombra.height = lienzo.height; }
  const g = sombra.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H); g.fillStyle = `rgba(8,6,10,${k})`; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'destination-out';
  const luz = PANTALLA_CFG.penumbra.luz * esc;
  for (const p of [...P.discos.filter((d) => !d.fuera), P.jug]) {
    const gr = g.createRadialGradient(sx(p.x), sy(p.y), luz * 0.25, sx(p.x), sy(p.y), luz); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(sx(p.x), sy(p.y), luz, 0, 6.283); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sombra, 0, 0); ctx.restore();
}

function pintar(dt) {
  const n = P.nivel, M = MESAS[n.mesa];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pintarFondo(M);
  ctx.save();
  if (temblor > 0.2) ctx.translate((Math.random() - 0.5) * temblor, (Math.random() - 0.5) * temblor);
  pintarMesa();
  pintarMarcador();
  for (const o of P.obs) dibObstaculo(ctx, o.id, o.tipo, sx(o.x), sy(o.y), o.r * esc);
  for (const it of P.items) {
    const queda = it.hasta - P.t;
    if (queda < 1.5 && Math.sin(P.t * 20) < 0) continue; // parpadea antes de irse
    dibItem(ctx, it.tipo, sx(it.x), sy(it.y), (it.r || PATINAZO_CFG.item.r) * esc, P.t);
  }
  for (const d of P.discos) pintarDisco(d);
  pintarMazo(P.riv, true); pintarMazo(P.jug, false);
  for (const c of chispas) { const a = 1 - c.t / c.vida; ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = c.color;
    if (c.puf) { ctx.beginPath(); ctx.arc(sx(c.x), sy(c.y), esc * 0.5 * (1 + c.t), 0, 6.283); ctx.fill(); }
    else ctx.fillRect(sx(c.x) - 2, sy(c.y) - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (n.penumbra) { pintarPenumbra(n.penumbra); pintarMarcador(); } // el tanteo, por encima de la penumbra: siempre se lee
  ctx.save();
  for (const t of textos) { const a = Math.min(1, 2 * (1 - t.t / t.vida)), k = 1 + Math.max(0, 0.25 - t.t) * 2;
    ctx.globalAlpha = Math.max(0, a); ctx.font = `400 ${Math.round(t.tam * k)}px 'Gochi Hand', cursive`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000000aa'; ctx.strokeText(t.txt, sx(t.x), sy(t.y) - t.t * 20); ctx.fillStyle = t.color; ctx.fillText(t.txt, sx(t.x), sy(t.y) - t.t * 20); }
  ctx.globalAlpha = 1;
  ctx.restore();
  pintarRival();
  if (estado === 'jugando' && !dedo && P.t < 6) {
    ctx.font = `800 ${Math.round(Math.max(13, Math.min(16, esc * 0.5)))}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const t1 = 'Pon el dedo donde quieras', t2 = 'y arrastra para mover el mazo', yb = sy(PATINAZO_CFG.mesa.largo * 0.2), wb = Math.max(ctx.measureText(t1).width, ctx.measureText(t2).width) + 28;
    ctx.fillStyle = 'rgba(20,17,13,.78)'; rrect(W / 2 - wb / 2, yb - 22, wb, 44, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(t1, W / 2, yb - 9); ctx.fillText(t2, W / 2, yb + 10);
  }
}

function animar(dt) {
  for (const c of chispas) { c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt; }
  chispas = chispas.filter((c) => c.t < c.vida);
  for (const b of brillos) b.t += dt; brillos = brillos.filter((b) => b.t < 0.35);
  for (const t of textos) t.t += dt; textos = textos.filter((t) => t.t < t.vida);
  temblor *= Math.pow(0.02, dt);
}

// ===== Bucle =====
let ultimo = performance.now(), acum = 0;
function bucle(ahoraMs) {
  requestAnimationFrame(bucle); // lo primero: si un marco falla, el siguiente llega igual
  try { marco(ahoraMs); } catch (e) { try { enviar({ tipo: 'error', m: String(e && e.message) }); } catch (er) {} }
}
function marco(ahoraMs) {
  if (window.innerWidth !== W || window.innerHeight !== H) medir();
  const dt = Math.min(0.1, (ahoraMs - ultimo) / 1000); ultimo = ahoraMs;
  if (!P || estado === 'portada' || estado === 'mapa' || estado === 'leyenda') { pintarHud(); return; }
  if (estado === 'jugando') {
    acum += dt; let k = 0;
    while (acum >= PATINAZO_CFG.paso && k < PANTALLA_CFG.pasosMaxFrame) { pasoPartida(P, dedo); acum -= PATINAZO_CFG.paso; k++; }
    if (k === PANTALLA_CFG.pasosMaxFrame) acum = 0;
    procesarUi();
    if (P.fase === 'fin' && finEn && ahoraMs / 1000 >= finEn) { finEn = 0; mostrarFinal(); }
  }
  if (performance.now() / 1000 > avisoHasta) $('aviso').classList.remove('ver');
  pintarHud();
  animar(dt);
  pintar(dt);
}
medir(); irPortada(); requestAnimationFrame(bucle);
// Para las capturas y las pruebas (scripts/captura-juego.mjs): jugar un nivel, ver el mapa o la leyenda y mirar el estado.
window.PATINAZO = { jugar, irPortada, verMapa, verLeyenda, mostrarIntro: (i) => { nivelIdx = i; P = crearPartida(NIVELES[i], 1); mostrarIntro(NIVELES[i], i); },
  empezar: () => $('b-empezar').onclick(), get P() { return P; }, set dedo(v) { dedo = v; }, decir, aviso, mostrarFinal, hojaElemento, hojaRival,
  guardado: () => guardado, fijarGuardado: (g) => { guardado = { ...guardadoVacio(), ...g }; guardar(); } };
window.PATINAZO_LISTO = true;
</script>
